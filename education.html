    <!-- =========================
         Active Menu
    ========================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const currentPage =
                    window.location.pathname
                        .split("/")
                        .pop()
                        .toLowerCase();


                const menuLinks =
                    document.querySelectorAll(
                        ".menu a"
                    );


                menuLinks.forEach(
                    function (link) {

                        const linkPage =
                            link
                                .getAttribute("href")
                                .split("/")
                                .pop()
                                .toLowerCase();


                        if (
                            linkPage ===
                            currentPage
                        ) {

                            link.classList.add(
                                "active"
                            );

                        } else {

                            link.classList.remove(
                                "active"
                            );

                        }

                    }
                );

            }
        );

    </script>
