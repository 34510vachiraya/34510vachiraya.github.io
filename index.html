<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome | Wachiraya Klangkaew</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Tahoma, sans-serif;
    color: #76536b;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 15% 20%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 15%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 70% 70%, #ffffff 0 2px, transparent 3px),
        linear-gradient(
            135deg,
            #ffe5f1,
            #f9d8e9,
            #eadcff,
            #fff1f8
        );

    background-size:
        130px 130px,
        180px 180px,
        160px 160px,
        cover;

    background-attachment: fixed;
}

/* กล่องหลัก */
.container {
    width: 90%;
    max-width: 650px;

    padding: 50px 30px;

    text-align: center;

    background: rgba(255, 255, 255, 0.92);

    border: 2px solid #efbfd8;
    border-radius: 35px;

    box-shadow:
        0 15px 40px rgba(150, 90, 140, 0.18);

    animation: appear 0.8s ease;
}

/* ดาว */
.stars {
    color: #d88db4;
    font-size: 25px;
    letter-spacing: 10px;
    margin-bottom: 20px;
}

/* ข้อความต้อนรับ */
.welcome {
    color: #c86696;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 3px;
}

/* ชื่อ */
h1 {
    margin: 12px 0 5px;

    color: #d05d92;

    font-size: 42px;
    letter-spacing: 2px;

    text-shadow: 2px 2px white;
}

/* ชื่ออังกฤษ */
.english {
    color: #8e657e;
    font-size: 19px;
    font-weight: bold;
}

/* คำอธิบาย */
.description {
    margin: 25px auto;

    max-width: 500px;

    color: #806579;

    font-size: 16px;
    line-height: 1.8;
}

/* เส้นตกแต่ง */
.decor {
    color: #d98db5;
    font-size: 20px;
    margin: 20px 0;
}

/* ปุ่ม */
.enter {
    display: inline-block;

    padding: 15px 38px;

    background: linear-gradient(
        135deg,
        #f0a8c9,
        #d98db5
    );

    color: white;

    text-decoration: none;

    border-radius: 30px;

    font-size: 17px;
    font-weight: bold;

    box-shadow:
        0 8px 18px rgba(200, 110, 155, 0.25);

    transition: 0.3s;
}

.enter:hover {
    transform: translateY(-5px);

    box-shadow:
        0 12px 25px rgba(200, 110, 155, 0.35);
}

.enter:active {
    transform: scale(0.96);
}

/* ข้อความล่าง */
.footer {
    margin-top: 30px;

    color: #a27c91;

    font-size: 13px;
}

/* Animation */
@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

/* มือถือ */
@media (max-width: 600px) {

    .container {
        padding: 40px 20px;
    }

    h1 {
        font-size: 34px;
    }

    .welcome {
        font-size: 14px;
    }

    .english {
        font-size: 17px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="stars">
        ✦　✧　♡　✧　✦
    </div>

    <div class="welcome">
        WELCOME TO
    </div>

    <h1>
        MY PORTFOLIO
    </h1>

    <div class="english">
        Wachiraya Klangkaew
    </div>

    <div class="decor">
        ─────── ♡ ───────
    </div>

    <div class="description">
        ยินดีต้อนรับเข้าสู่แฟ้มสะสมผลงานของ
        <b>วชิรญาณ์ คลังแก้ว</b>
        <br>
        ภายในเว็บไซต์รวบรวมประวัติการศึกษา
        ผลงาน กิจกรรม และความสามารถต่าง ๆ
    </div>

    <!-- ปุ่มเข้า Portfolio -->
    <a href="portfolio.html" class="enter">
        ✨ เข้าสู่ Portfolio →
    </a>

    <div class="footer">
        © 2026 Wachiraya Klangkaew
    </div>

</div>

</body>
</html>
